name: Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

env:
  GCS_ARTIFACT_PREFIX: latest
  REGION: europe-west6
  SERVICE_NAME: highjump-ui

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: make test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create CI environment file
        run: |
          cat > .env <<EOF
          PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}
          GCS_ARTIFACT_PREFIX=${GCS_ARTIFACT_PREFIX}
          EOF

      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: world-athletics-raw-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            world-athletics-raw-${{ runner.os }}-

      - name: Build Docker image
        run: make build

      - name: Fetch raw data
        run: make fetch

      - name: Build features
        run: make features

      - name: Train model
        run: make train

      - name: Run inference smoke test
        run: make inference

      - name: Upload cloud artifacts to GCS
        run: |
          gcloud storage cp data/raw/highjump_results.parquet \
            "gs://${{ secrets.GCS_BUCKET_NAME }}/${GCS_ARTIFACT_PREFIX}/data/raw/highjump_results.parquet"

          gcloud storage cp data/features/highjump_features.parquet \
            "gs://${{ secrets.GCS_BUCKET_NAME }}/${GCS_ARTIFACT_PREFIX}/data/features/highjump_features.parquet"

          gcloud storage cp models/highjump_model.joblib \
            "gs://${{ secrets.GCS_BUCKET_NAME }}/${GCS_ARTIFACT_PREFIX}/models/highjump_model.joblib"

          gcloud storage cp models/latest_mlflow_run.txt \
            "gs://${{ secrets.GCS_BUCKET_NAME }}/${GCS_ARTIFACT_PREFIX}/models/latest_mlflow_run.txt"

      - name: Verify cloud artifacts
        run: |
          gcloud storage ls "gs://${{ secrets.GCS_BUCKET_NAME }}/${GCS_ARTIFACT_PREFIX}/data/raw/highjump_results.parquet"
          gcloud storage ls "gs://${{ secrets.GCS_BUCKET_NAME }}/${GCS_ARTIFACT_PREFIX}/data/features/highjump_features.parquet"
          gcloud storage ls "gs://${{ secrets.GCS_BUCKET_NAME }}/${GCS_ARTIFACT_PREFIX}/models/highjump_model.joblib"
          gcloud storage ls "gs://${{ secrets.GCS_BUCKET_NAME }}/${GCS_ARTIFACT_PREFIX}/models/latest_mlflow_run.txt"

      - name: Deploy Streamlit UI to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --source . \
            --region "${REGION}" \
            --service-account "highjump-cloud-run@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars "GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }},GCS_ARTIFACT_PREFIX=${GCS_ARTIFACT_PREFIX},GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},GCLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --quiet

      - name: Show Cloud Run URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format="value(status.url)"

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: highjump-pipeline-outputs-${{ github.run_number }}
          path: |
            models/highjump_model.joblib
            models/latest_mlflow_run.txt
            mlruns/
            data/features/highjump_features.parquet
          if-no-files-found: error
          retention-days: 14