services:
  features:
    build: .
    image: highjump-mlops
    volumes:
      - ./data:/app/data
    command: feature-pipeline

  train:
    build: .
    image: highjump-mlops
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    command: train-pipeline

  inference:
    build: .
    image: highjump-mlops
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      ATHLETE: ${ATHLETE:-Mutaz Essa BARSHIM}
    command: sh -c 'python -m highjump_mlops.inference.cli "$$ATHLETE"'

  ui:
    build: .
    image: highjump-mlops
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: streamlit run src/highjump_mlops/ui/app.py --server.address=0.0.0.0 --server.port=8501

  mlflow:
    build: .
    image: highjump-mlops
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: mlflow ui --backend-store-uri file:mlruns --host 0.0.0.0 --port 5000
