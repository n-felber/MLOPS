services:
  fetch:
    build: .
    image: highjump-mlops
    volumes:
      - ./data:/app/data
    command: fetch-data

  features:
    build: .
    image: highjump-mlops
    volumes:
      - ./data:/app/data
    command: feature-pipeline

  train:
    build: .
    image: highjump-mlops
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ~/.config/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    environment:
      GOOGLE_CLOUD_PROJECT: ${PROJECT_ID}
      GCLOUD_PROJECT: ${PROJECT_ID}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      GCS_ARTIFACT_PREFIX: ${GCS_ARTIFACT_PREFIX:-latest}
    command: train-pipeline

  inference:
    build: .
    image: highjump-mlops
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ~/.config/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    environment:
      ATHLETE: ${ATHLETE:-Mutaz Essa BARSHIM}
      GOOGLE_CLOUD_PROJECT: ${PROJECT_ID}
      GCLOUD_PROJECT: ${PROJECT_ID}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      GCS_ARTIFACT_PREFIX: ${GCS_ARTIFACT_PREFIX:-latest}
    command: sh -c 'python -m highjump_mlops.inference.cli "$$ATHLETE"'

  ui:
    build: .
    image: highjump-mlops
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ~/.config/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    environment:
      GOOGLE_CLOUD_PROJECT: ${PROJECT_ID}
      GCLOUD_PROJECT: ${PROJECT_ID}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      GCS_ARTIFACT_PREFIX: ${GCS_ARTIFACT_PREFIX:-latest}
    command: streamlit run src/highjump_mlops/ui/app.py --server.address=0.0.0.0 --server.port=8501

  mlflow:
    build: .
    image: highjump-mlops
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: mlflow ui --backend-store-uri file:mlruns --host 0.0.0.0 --port 5000
